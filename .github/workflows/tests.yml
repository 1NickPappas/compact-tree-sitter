name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "latest"

      - name: 🛠️ Install dependencies
        run: |
          bun install

      - name: 🧹 Run ESLint
        run: bun run lint

      - name: 🧪 Run tree-sitter tests
        run: bun run test

      - name: 🧱 Verify the parser is up to date
        run: |
          bun run generate
          git diff --exit-code src/
