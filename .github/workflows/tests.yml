name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Parser and bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Pinned so the "Verify generated parser" step compares against the same
      # tree-sitter release that generated the committed src/parser.c (0.26.13).
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.26.13

      - name: Run parser and binding tests
        uses: tree-sitter/parser-test-action@v3
        with:
          # Regenerate and fail if src/parser.c is out of date, then run the
          # corpus tests, then the binding tests for every binding we ship.
          test-rust: true
          test-python: true
          test-go: true
          test-swift: true
