name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "latest"
          cache: npm

      - name: 🛠️ Install dependencies
        run: npm ci

      - name: 🧹 Run ESLint
        run: npm run lint

      - name: 🧪 Run tree-sitter tests
        run: npm run test

      - name: 🧱 Verify the parser is up to date
        run: |
          npm run generate
          git diff --exit-code src/
