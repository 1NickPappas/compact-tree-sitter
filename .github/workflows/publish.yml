name: Publish packages

on:
  push:
    tags: ["*"]
  # Manual trigger, e.g. to add npm/PyPI for an already-published version:
  #   gh workflow run publish.yml -f skip-crates=true -f skip-github-release=true
  workflow_dispatch:
    inputs:
      skip-crates:
        description: Skip crates.io (version already published)
        type: boolean
        default: false
      skip-github-release:
        description: Skip the GitHub release (already created)
        type: boolean
        default: false
      skip-pypi:
        description: Skip PyPI
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  github:
    if: ${{ github.event_name == 'push' || inputs.skip-github-release != true }}
    name: GitHub release
    uses: tree-sitter/workflows/.github/workflows/release.yml@main

  crates:
    if: ${{ github.event_name == 'push' || inputs.skip-crates != true }}
    name: crates.io
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@main
    with:
      package-name: tree-sitter-compact
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # npm is published by the dedicated publish-npm workflow (see that file for
  # why we do not use the reusable package-npm workflow).

  pypi:
    if: ${{ github.event_name == 'push' || inputs.skip-pypi != true }}
    name: PyPI
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main
    with:
      package-name: tree-sitter-compact
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
