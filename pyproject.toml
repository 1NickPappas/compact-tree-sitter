[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-compact"
description = "A zero-knowledge smart contract programming language"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "compact"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [
  { name = "Nick Pappas" },
  { name = "Lucas Rosa", email = "lucas.rosa@shielded.io" },
]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/1NickPappas/compact-tree-sitter"
Repository = "https://github.com/1NickPappas/compact-tree-sitter"
Issues = "https://github.com/1NickPappas/compact-tree-sitter/issues"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.compact]
language = "0.23.0"
toolchain = "0.31.1"
runtime = "0.16.0"

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
